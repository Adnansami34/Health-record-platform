<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Record Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--panel:#fff;--ink:#12302f;--mute:#5d7270;--line:#d9e3e1;--brand:#0f5e5a;--brandtxt:#fff;--soft:#e3f0ee;--alert:#b83b25;--alertbg:#fbeae6;--ok:#2d7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--panel:#15262a;--ink:#e6f0ee;--mute:#92aaa7;--line:#27403f;--brand:#4fb3aa;--brandtxt:#07201f;--soft:#1b3433;--alert:#ff8f78;--alertbg:#3a1f1a;--ok:#6fd08f}}
:root[data-theme="dark"]{--bg:#0e1a19;--panel:#15262a;--ink:#e6f0ee;--mute:#92aaa7;--line:#27403f;--brand:#4fb3aa;--brandtxt:#07201f;--soft:#1b3433;--alert:#ff8f78;--alertbg:#3a1f1a;--ok:#6fd08f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}
.app{display:flex;min-height:100%}
nav{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;flex-shrink:0}
nav h1{font:600 20px "Newsreader",Georgia,serif;margin:0 8px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:var(--soft)}
nav button[aria-current=page]{background:var(--brand);color:var(--brandtxt)}
nav button.add{border:1.5px dashed var(--brand);color:var(--brand);margin-bottom:10px;font-weight:600}
nav button.add[aria-current=page]{border-style:solid;color:var(--brandtxt)}
main{flex:1;padding:24px;max-width:900px;min-width:0}
h2{font:600 28px "Newsreader",Georgia,serif;margin:0 0 4px}
h3{font:600 18px "Newsreader",Georgia,serif;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-weight:500;font-size:13px;margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn{background:var(--brand);color:var(--brandtxt);border:0;border-radius:8px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--alert);color:#fff}
.btn.sm{padding:3px 10px;font-size:12px;margin-left:8px}
.err{color:var(--alert);font-size:12px;margin-top:3px;min-height:0}
.k{color:var(--mute);font-size:12px}.v{font-weight:500}
.crit{background:var(--alertbg);border:1px solid var(--alert)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--soft);font-size:12px;margin:2px 4px 2px 0}
.pill.bad{background:var(--alertbg);color:var(--alert)}.pill.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.src{font-size:11px;color:var(--mute)}
.tl{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.tl div{margin-bottom:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:var(--brandtxt);padding:10px 18px;border-radius:8px;display:none;z-index:9}
.scroll{overflow-x:auto}
@media(max-width:720px){.app{flex-direction:column}nav{width:100%;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav h1{display:none}nav button{width:auto;white-space:nowrap}main{padding:16px}}
</style></head>
<body>
<div class="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY='hrp-v3';
const seed=()=>({sel:'HR-000124',log:[{t:Date.now(),who:'System',what:'Sample record loaded'}],patients:[{id:'HR-000124',name:'Mohammed Ahmed',dob:'1995-04-12',gender:'Male',blood:'B+',mobile:'+000 0000 0000',ecName:'Aisha Ahmed',ecPhone:'+000 0000 0001',allergies:['Penicillin'],conditions:[{n:'Hypertension',d:'2021-06-15'}],surgeries:[{n:'Appendectomy',d:'2018-02-12'}],notes:'',docs:[{title:'Appendectomy discharge summary',cat:'Discharge summary',date:'2018-02-14'},{title:'Blood test report',cat:'Laboratory',date:'2024-03-02'},{title:'Prescription',cat:'Prescription',date:'2024-03-05'},{title:'CT scan report',cat:'Imaging',date:'2023-09-18'}],access:[{who:'Dr. Rao, Hyderabad City Hospital',exp:'2027-01-31',revoked:false}]}]});
const D=(t,c,d)=>({title:t,cat:c,date:d});
const RAO='Dr. Rao, Hyderabad City Hospital',IYER='Dr. Meera Iyer, Apollo Clinic';
const sample=[
['Fatima Khan','1988-09-03','Female','O+',['Dust','Sulfa drugs'],[['Type 2 diabetes','2022-03-10']],[['Caesarean section','2016-07-21']],[D('HbA1c blood test','Laboratory','2025-08-12'),D('Metformin prescription','Prescription','2025-08-14')],[[RAO,'2027-03-31',0]],'Imran Khan'],
['Rahul Verma','1979-01-25','Male','A+',[],[['Hypertension','2019-11-02'],['High cholesterol','2021-05-18']],[['Angioplasty','2023-02-09']],[D('Lipid profile','Laboratory','2025-06-20'),D('ECG report','Other','2025-06-21'),D('Cardiac discharge summary','Discharge summary','2023-02-12')],[[RAO,'2027-01-15',0],[IYER,'2026-09-30',0]],'Neha Verma'],
['Priya Nair','2001-03-22','Female','O-',['Peanuts'],[['Iron-deficiency anemia','2024-02-11']],[],[D('Complete blood count','Laboratory','2026-03-05'),D('Iron supplement prescription','Prescription','2026-03-06')],[],'Anil Nair'],
['Yusuf Hassan','1992-08-08','Male','A-',[],[['Migraine','2018-06-06']],[['Appendectomy','2015-03-17']],[D('MRI brain report','Imaging','2024-09-09'),D('Neurology prescription','Prescription','2024-09-10')],[[IYER,'2026-12-31',1]],'Hana Hassan'],
['Arjun Reddy','1958-02-19','Male','O+',['Penicillin','Iodine contrast'],[['Coronary artery disease','2017-12-05'],['Type 2 diabetes','2010-07-07']],[['Coronary bypass surgery','2018-01-22'],['Knee replacement','2024-04-16']],[D('Echocardiogram report','Imaging','2025-10-02'),D('Bypass discharge summary','Discharge summary','2018-01-30'),D('HbA1c blood test','Laboratory','2026-02-12'),D('Diabetes prescription','Prescription','2026-02-13')],[[RAO,'2027-05-31',0],[IYER,'2027-05-31',0]],'Kavitha Reddy'],
['Leila Haddad','1986-08-14','Female','A+',['Shellfish'],[['High cholesterol','2023-04-12']],[],[D('Lipid profile','Laboratory','2026-04-08'),D('Statin prescription','Prescription','2026-04-09')],[[RAO,'2027-02-28',0]],'Samir Haddad'],
['Karim Mansour','1964-03-27','Male','B+',[],[['Type 2 diabetes','2015-09-14'],['Hypertension','2018-01-20']],[['Cataract surgery','2022-06-11']],[D('HbA1c blood test','Laboratory','2026-05-02'),D('Eye surgery discharge summary','Discharge summary','2022-06-12'),D('Blood pressure prescription','Prescription','2026-05-03')],[],'Rima Mansour'],
['Anita Rao','1983-09-05','Female','O-',['Latex'],[['Hypothyroidism','2020-02-18']],[['Thyroidectomy','2021-08-05']],[D('Thyroid function test','Laboratory','2026-01-15'),D('Levothyroxine prescription','Prescription','2026-01-16')],[[IYER,'2026-12-31',0]],'Vijay Rao'],
['Omar Siddiqui','1975-11-30','Male','AB+',['Aspirin'],[['Asthma','2012-05-09']],[['Hernia repair','2019-10-03']],[D('Spirometry report','Laboratory','2025-11-20'),D('Chest X-ray report','Imaging','2025-11-21'),D('Inhaler prescription','Prescription','2025-11-22')],[[RAO,'2026-10-31',0]],'Zara Siddiqui']
].map((r,i)=>({id:'HR-'+String(125+i).padStart(6,'0'),name:r[0],dob:r[1],gender:r[2],blood:r[3],mobile:'+000 0000 00'+(25+i),ecName:r[9],ecPhone:'+000 0000 01'+(25+i),allergies:r[4],conditions:r[5].map(x=>({n:x[0],d:x[1]})),surgeries:r[6].map(x=>({n:x[0],d:x[1]})),notes:'',docs:r[7],access:r[8].map(x=>({who:x[0],exp:x[1],revoked:!!x[2]}))}));
const seedAll=()=>{const s=seed();s.patients.push(...sample);s.log[0].what='10 synthetic patients loaded';return s};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seedAll()}catch(e){S=seedAll()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='dash',chat=[],role='Patient',doc='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>S.patients.find(p=>p.id===S.sel);
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—';
const log=(who,what)=>{S.log.unshift({t:Date.now(),who,what});save()};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)};
const today=()=>new Date().toISOString().slice(0,10);
const views=[['add','+ Add details'],['dash','Dashboard'],['rec','Health record'],['docs','Documents'],['bot','Assistant'],['acc','Access control'],['em','Emergency profile'],['hist','Access history']];
function nav(){document.getElementById('nav').innerHTML='<h1>Health Record</h1>'+views.map(([k,l])=>`<button class="${k=='add'?'add':''}" data-v="${k}" ${view==k?'aria-current="page"':''}>${l}</button>`).join('')}
function picker(){return `<div class="bar"><label style="margin:0">Patient<select id="pick">${S.patients.map(p=>`<option value="${esc(p.id)}" ${p.id==S.sel?'selected':''}>${esc(p.name)} (${esc(p.id)})</option>`).join('')}</select></label></div>`}
function summary(p){
 const s=[];
 const c=p.conditions.map(x=>x.n),g=p.surgeries.map(x=>x.n);
 s.push([`${p.name} has ${c.length?c.length+' recorded condition'+(c.length>1?'s':'')+' ('+c.join(', ')+')':'no recorded conditions'}.`,'Patient profile']);
 if(g.length)s.push([`Past surgeries: ${g.join(', ')}.`,'Medical history']);
 s.push([p.allergies.length?`Documented allergies: ${p.allergies.join(', ')}.`:'No allergies are documented.','Patient profile']);
 s.push([`Blood group: ${p.blood||'not recorded'}.`,'Patient profile']);
 if(p.docs.length)s.push([`${p.docs.length} document${p.docs.length>1?'s':''} on file, latest: ${p.docs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].title}.`,'Documents']);
 return s}
function render(){
 nav();const m=document.getElementById('main');const p=cur();
 if(view=='add'){m.innerHTML=`<h2>Add patient details</h2><p class="sub">Fields marked * are required. Use synthetic data only on this prototype.</p>
 <form id="f" novalidate><div class="card"><h3>Basic information</h3><div class="grid">
 <label>Full name *<input name="name" autocomplete="off"><span class="err"></span></label>
 <label>Date of birth *<input type="date" name="dob" max="${today()}"><span class="err"></span></label>
 <label>Gender<select name="gender"><option>Female</option><option>Male</option><option>Other</option></select></label>
 <label>Blood group *<select name="blood"><option value="">Select</option>${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b=>`<option>${b}</option>`).join('')}</select><span class="err"></span></label>
 <label>Mobile<input name="mobile" inputmode="tel"></label></div></div>
 <div class="card"><h3>Emergency contact</h3><div class="grid"><label>Name *<input name="ecName"><span class="err"></span></label><label>Phone<input name="ecPhone" inputmode="tel"></label></div></div>
 <div class="card"><h3>Medical details</h3>
 <label>Allergies (comma separated)<input name="allergies" placeholder="Penicillin, Peanuts"></label>
 <div class="grid"><label>Condition<input name="cond"></label><label>Diagnosed on<input type="date" name="condD" max="${today()}"></label>
 <label>Surgery<input name="surg"></label><label>Surgery date<input type="date" name="surgD" max="${today()}"></label></div>
 <label>Notes<textarea name="notes" rows="3"></textarea></label></div>
 <button class="btn" type="submit">Save patient</button> <button class="btn ghost" type="reset">Clear form</button></form>`;
  document.getElementById('f').onsubmit=addPatient;return}
 if(!p){m.innerHTML='<h2>No patients yet</h2><p class="sub">Add your first patient to begin.</p><button class="btn" data-v="add">Add details</button>';return}
 let h=picker();
 if(view=='dash'){h+=`<h2>Welcome, ${esc(p.name.split(' ')[0])}</h2><p class="sub">Your health record in one place. Prototype with synthetic data.</p>
 <div class="grid">${[['Blood group',p.blood],['Conditions',p.conditions.length],['Surgeries',p.surgeries.length],['Documents',p.docs.length]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div style="font:600 28px Newsreader,serif">${esc(v)}</div></div>`).join('')}</div>
 <div class="card"><h3>Record summary</h3>${summary(p).map(([t,s])=>`<p style="margin:0 0 6px">${esc(t)} <span class="src">Source: ${s}</span></p>`).join('')}<p class="src">Generated from the entered record. Not a diagnosis or medical advice. Original documents remain the source of truth.</p></div>`}
 if(view=='rec'){h+=`<h2>${esc(p.name)}</h2><p class="sub">Patient ID ${esc(p.id)}</p>
 <div class="card"><div class="grid">${[['Date of birth',fd(p.dob)],['Gender',p.gender],['Mobile',p.mobile||'—'],['Blood group',p.blood],['Emergency contact',p.ecName+(p.ecPhone?' · '+p.ecPhone:'')],['Status','Active']].map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div></div>
 <div class="card"><h3>Medical history</h3><div class="tl">${[...p.conditions.map((x,i)=>({...x,k:'Condition',t:'conditions',i})),...p.surgeries.map((x,i)=>({...x,k:'Surgery',t:'surgeries',i}))].sort((a,b)=>(b.d||'').localeCompare(a.d||'')).map(x=>`<div><b>${esc(x.n)}</b> <span class="pill">${x.k}</span><button class="btn ghost sm" data-del="${x.t}:${x.i}">Delete</button><br><span class="k">${fd(x.d)}</span></div>`).join('')||'<span class="k">No history added yet.</span>'}</div>${p.notes?`<p class="k">Notes</p><p>${esc(p.notes)}</p>`:''}</div>
 <button class="btn ghost" data-v="add">Add another patient</button> <button class="btn ghost" id="clr">Clear all history</button> <button class="btn danger" id="delp">Delete patient</button>`}
 if(view=='docs'){h+=`<h2>Medical documents</h2><p class="sub">Add a document entry, then search or filter.</p>
 <div class="card"><form id="df" class="grid" novalidate><label>Title *<input name="title"></label><label>Category<select name="cat">${['Laboratory','Imaging','Prescription','Discharge summary','Other'].map(c=>`<option>${c}</option>`).join('')}</select></label><label>Date<input type="date" name="date" value="${today()}" max="${today()}"></label><label>File (optional)<input type="file" name="file"></label><div><button class="btn" type="submit">Add document</button></div></form></div>
 <div class="bar"><input id="q" placeholder="Search documents" style="max-width:260px;margin:0"><select id="cf" style="max-width:200px;margin:0"><option value="">All categories</option>${['Laboratory','Imaging','Prescription','Discharge summary','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div class="card" id="dl"></div>`}
 if(view=='bot'){const acts=p.access.filter(a=>!a.revoked&&a.exp>=today()).map(a=>a.who);if(role=='Doctor'&&!acts.includes(doc))doc=acts[0]||'';
 h+=`<h2>Record assistant</h2><p class="sub">Ask about this patient’s record. Answers come only from the saved record and always show their source.</p><div class="card"><div class="grid"><label>I am a<select id="role"><option ${role=='Patient'?'selected':''}>Patient</option><option ${role=='Doctor'?'selected':''}>Doctor</option></select></label>${role=='Doctor'&&acts.length?`<label>Signed in as<select id="docsel">${acts.map(a=>`<option ${a==doc?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`:''}</div></div>`;
 if(role=='Doctor'&&!acts.length)h+=`<div class="card crit"><b>No doctor has active access to this record.</b><br><span class="k">Grant access in Access control first. Doctors can only search records that the patient has shared.</span></div>`;
 else{const ch=role=='Doctor'?['Allergies','Conditions and surgeries','Latest prescription','List documents']:['What allergies do I have?','Show my blood test','List my documents','Who can see my record?'];
 h+=`<div class="card"><div id="chat" style="min-height:140px;max-height:360px;overflow-y:auto"></div><div style="margin:10px 0">${ch.map(c=>`<button type="button" class="btn ghost sm" style="margin:0 6px 6px 0" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div><form id="qf" class="bar" style="margin:0" novalidate><input id="qi" placeholder="Type your question" autocomplete="off" style="margin:0;flex:1"><button class="btn" type="submit">Ask</button></form></div>`}}
 if(view=='acc'){h+=`<h2>Access control</h2><p class="sub">Choose who can see this record and until when. Revoke at any time.</p>
 <div class="card"><form id="af" class="grid" novalidate><label>Doctor or hospital *<input name="who"></label><label>Access expires on *<input type="date" name="exp" min="${today()}"></label><div><button class="btn" type="submit">Grant access</button></div></form></div>
 <div class="card">${p.access.map((a,i)=>{const st=a.revoked?'Revoked':a.exp<today()?'Expired':'Active';return `<div class="row"><div><b>${esc(a.who)}</b><br><span class="k">Until ${fd(a.exp)}</span></div><div><span class="pill ${st=='Active'?'ok':'bad'}">${st}</span>${st=='Active'?`<button class="btn danger" data-rev="${i}">Revoke</button>`:''}</div></div>`}).join('')||'<span class="k">No one has access yet.</span>'}</div>`}
 if(view=='em'){h+=`<h2>Emergency profile</h2><p class="sub">Shows only life-critical details. Opening it needs a reason, and every opening is logged.</p><div id="emb">
 <div class="card"><label>Reason for emergency access *<input id="why" placeholder="e.g. Unconscious patient in ER"></label><button class="btn danger" id="bg">Open emergency profile</button></div></div>`}
 if(view=='hist'){h+=`<h2>Access history</h2><p class="sub">Every view, grant, revoke and edit is recorded here.</p><div class="card scroll">${S.log.slice(0,60).map(l=>`<div class="row"><span>${esc(l.what)}</span><span class="k">${esc(l.who)} · ${new Date(l.t).toLocaleString('en-GB')}</span></div>`).join('')}</div>`}
 m.innerHTML=h;
 if(view=='docs'){drawDocs();document.getElementById('df').onsubmit=addDoc;document.getElementById('q').oninput=drawDocs;document.getElementById('cf').onchange=drawDocs}
 if(view=='acc')document.getElementById('af').onsubmit=grant;
 if(view=='em')document.getElementById('bg').onclick=breakGlass;
 if(view=='bot'){const rs=document.getElementById('role');rs.onchange=()=>{role=rs.value;chat=[];render()};const ds=document.getElementById('docsel');if(ds)ds.onchange=()=>{doc=ds.value;chat=[];render()};const qf=document.getElementById('qf');if(qf){drawChat();qf.onsubmit=ev=>{ev.preventDefault();const i=document.getElementById('qi');ask(i.value);i.value=''}}}
}
const R={allergy:/allerg|reaction/,cond:/condition|diagnos|disease|illness|hypertension|diabetes|problems?\b/,surg:/surger|operation|procedure|appendectomy/,blood:/blood (group|type)/,med:/medicine|medication|prescription|drug|tablet/,doc:/\b(documents?|reports?|files?|scans?|ct|mri|x-?ray|labs?|tests?|discharge|imaging)\b/,ec:/emergency contact|next of kin|relative/,acc:/who (can|has)|access|shared|permission/,sum:/overview|everything|full record|record summary|about me/};
const STOP=new Set('the and what show tell give list all any are has have with for who can you does did about from that this please how'.split(' '));
function answer(q,p,r){const s=q.toLowerCase(),pt=r=='Patient',o=[];
 const T=s.split(/[^a-z0-9]+/).filter(t=>t.length>2&&!STOP.has(t));
 if(R.sum.test(s))summary(p).forEach(x=>o.push(x));
 if(R.allergy.test(s))o.push([p.allergies.length?(pt?'You have a documented allergy to ':'Allergies: ')+p.allergies.join(', ')+'.':'No allergies are documented.','Patient profile']);
 const hist=/\bhistory\b/.test(s);
 if(R.cond.test(s)||hist)o.push([p.conditions.length?(pt?'Your recorded conditions: ':'Conditions: ')+p.conditions.map(c=>c.n+(c.d?' (since '+c.d.slice(0,4)+')':'')).join(', ')+'.':'No conditions are recorded.','Medical history']);
 if(R.surg.test(s)||hist)o.push([p.surgeries.length?(pt?'Your past surgeries: ':'Surgeries: ')+p.surgeries.map(c=>c.n+(c.d?' ('+fd(c.d)+')':'')).join(', ')+'.':'No surgeries are recorded.','Medical history']);
 if(R.blood.test(s))o.push(['Blood group: '+(p.blood||'not recorded')+'.','Patient profile']);
 if(R.ec.test(s))o.push(['Emergency contact: '+p.ecName+(p.ecPhone?', '+p.ecPhone:'')+'.','Patient profile']);
 if(R.acc.test(s))p.access.length?p.access.forEach(a=>o.push([a.who+': '+(a.revoked?'revoked':a.exp<today()?'expired':'active')+', until '+fd(a.exp)+'.','Access control'])):o.push(['No one has been granted access.','Access control']);
 if(R.med.test(s)){const rx=p.docs.filter(d=>d.cat=='Prescription');o.push([rx.length?'Prescription on file: '+rx.map(d=>d.title+' ('+fd(d.date)+')').join('; ')+'. The medicine list is inside the document itself.':'No prescription is on file.','Documents'])}
 else if(!(R.blood.test(s)&&!R.doc.test(s))){const ds=p.docs.filter(d=>T.some(t=>(d.title+' '+d.cat).toLowerCase().includes(t.replace(/s$/,''))));
  if(ds.length||R.doc.test(s)){const L=ds.length?ds:p.docs;o.push([L.length?(ds.length?'Matching documents: ':'Documents on file: ')+L.map(d=>d.title+' ('+d.cat+', '+fd(d.date)+')').join('; ')+'.':'No documents are on file.','Documents'])}}
 if(!o.length)o.push(['I couldn’t find that in this record. Try asking about allergies, conditions, surgeries, documents, prescriptions, blood group, or who has access.','']);
 else if(!pt)o.push(['Check the original documents before making clinical decisions.','']);
 return o}
function ask(q){q=q.trim();if(!q)return;const p=cur();const who=role=='Doctor'?(doc||'Doctor'):'Patient';
 chat.push({me:1,t:q});chat.push({t:answer(q,p,role)});log(who,'Assistant search: “'+q+'”');drawChat()}
function drawChat(){const c=document.getElementById('chat');if(!c)return;
 c.innerHTML=chat.length?chat.map(m=>m.me?`<div style="text-align:right;margin:6px 0"><span class="pill" style="font-size:14px;padding:6px 12px">${esc(m.t)}</span></div>`:`<div style="margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:10px">${m.t.map(([x,s])=>`<div>${esc(x)}${s?` <span class="src">Source: ${esc(s)}</span>`:''}</div>`).join('')}</div>`).join(''):'<span class="k">Ask a question or tap a suggestion to begin.</span>';c.scrollTop=c.scrollHeight}
function drawDocs(){const p=cur(),q=(document.getElementById('q').value||'').toLowerCase(),c=document.getElementById('cf').value;
 const l=p.docs.filter(d=>(!q||d.title.toLowerCase().includes(q))&&(!c||d.cat==c)).sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('dl').innerHTML=l.map(d=>`<div class="row"><div><b>${esc(d.title)}</b><br><span class="k">${esc(d.cat)} · ${fd(d.date)}${d.file?' · '+esc(d.file):''}</span></div><button class="btn ghost sm" data-del="docs:${p.docs.indexOf(d)}">Delete</button></div>`).join('')||'<span class="k">No documents match.</span>'}
function addPatient(e){e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim();let ok=true;
 f.querySelectorAll('.err').forEach(x=>x.textContent='');
 const need=(n,msg)=>{if(!v(n)){f.elements[n].parentElement.querySelector('.err').textContent=msg;ok=false}};
 need('name','Enter the patient’s full name.');need('dob','Choose a date of birth.');need('blood','Select a blood group.');need('ecName','Enter an emergency contact.');
 if(!ok)return;
 const id='HR-'+String(100000+Math.floor(Math.random()*899999));
 const p={id,name:v('name'),dob:v('dob'),gender:v('gender'),blood:v('blood'),mobile:v('mobile'),ecName:v('ecName'),ecPhone:v('ecPhone'),allergies:v('allergies').split(',').map(s=>s.trim()).filter(Boolean),conditions:v('cond')?[{n:v('cond'),d:v('condD')}]:[],surgeries:v('surg')?[{n:v('surg'),d:v('surgD')}]:[],notes:v('notes'),docs:[],access:[]};
 S.patients.push(p);S.sel=id;log('You','Added patient '+p.name+' ('+id+')');view='rec';render();toast('Patient saved')}
function addDoc(e){e.preventDefault();const f=e.target;if(!f.title.value.trim()){toast('Enter a document title');return}
 const d={title:f.title.value.trim(),cat:f.cat.value,date:f.date.value||today(),file:f.file.files[0]?.name};cur().docs.push(d);log('You','Added document “'+d.title+'”');render();toast('Document added')}
function grant(e){e.preventDefault();const f=e.target;if(!f.who.value.trim()||!f.exp.value){toast('Enter a name and an expiry date');return}
 cur().access.push({who:f.who.value.trim(),exp:f.exp.value,revoked:false});log('You','Granted access to '+f.who.value.trim()+' until '+f.exp.value);render();toast('Access granted')}
function breakGlass(){const w=document.getElementById('why').value.trim();if(w.length<5){toast('Enter a reason first');return}
 const p=cur();log('Emergency access','Opened emergency profile of '+p.name+'. Reason: '+w);
 document.getElementById('emb').innerHTML=`<div class="card crit"><h3>Critical health profile</h3><div class="grid">${[['Blood group',p.blood],['Allergies',p.allergies.join(', ')||'None documented'],['Conditions',p.conditions.map(c=>c.n).join(', ')||'None documented'],['Surgeries',p.surgeries.map(c=>c.n).join(', ')||'None documented'],['Emergency contact',p.ecName+' '+p.ecPhone]].map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div></div><p class="src">This access was recorded in Access history.</p>`}
document.addEventListener('click',e=>{
 const qc=e.target.closest('[data-q]');if(qc){ask(qc.dataset.q);return}
 const dl=e.target.closest('[data-del],#clr,#delp');
 if(dl){
  if(!dl.dataset.arm){dl.dataset.arm='1';dl.dataset.lbl=dl.textContent;dl.textContent='Click again to confirm';setTimeout(()=>{if(dl.isConnected){delete dl.dataset.arm;dl.textContent=dl.dataset.lbl}},4000);return}
  const p=cur();
  if(dl.id=='delp'){const n=p.name,pid=p.id;S.patients=S.patients.filter(x=>x.id!==pid);S.sel=S.patients[0]?.id||'';log('You','Deleted patient '+n+' ('+pid+')');view=S.patients.length?'dash':'add';render();toast('Patient deleted')}
  else if(dl.id=='clr'){p.conditions=[];p.surgeries=[];p.allergies=[];p.notes='';p.docs=[];log('You','Cleared all history for '+p.name);render();toast('History cleared')}
  else{const[t,i]=dl.dataset.del.split(':');const it=p[t][+i];const nm=it.n||it.title;p[t].splice(+i,1);log('You','Deleted “'+nm+'” from '+p.name+'’s record');render();toast('Deleted')}
  return}
 const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render()}
 const r=e.target.closest('[data-rev]');if(r){const a=cur().access[+r.dataset.rev];a.revoked=true;log('You','Revoked access for '+a.who);render();toast('Access revoked')}});
document.addEventListener('change',e=>{if(e.target.id=='pick'){S.sel=e.target.value;chat=[];save();render()}});
render();
</script></body></html>
